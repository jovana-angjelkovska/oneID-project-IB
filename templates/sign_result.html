{% extends "base.html" %}

{% block title %}Signature Result{% endblock %}

{% block content %}
<div class="app-card text-center">

    <h3>✔ Document Signed Successfully</h3>

    <p><b>User:</b> {{ username }}</p>
    <p><b>Document:</b> {{ document }}</p>

    <p><b>Signature:</b></p>
    <textarea class="form-control" rows="6">{{ signature }}</textarea>

    <div class="alert alert-info mt-3">
        ⚠️ Copy this signature carefully — it is required for verification.
    </div>

    <a href="/dashboard" class="btn btn-primary w-100 mt-3">Back to Dashboard</a>
</div>
{% endblock %}
