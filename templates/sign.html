{% extends "base.html" %}

{% block title %}Sign Document{% endblock %}

{% block content %}
<div class="app-card text-center">

    <h2>Sign Document</h2>

    <p class="text-muted">
        You are signed in as: <b>{{ session["username"] }}</b>
    </p>

    <form method="POST">
        <textarea name="document" class="form-control mt-3" rows="6"
                  placeholder="Enter document to sign..." required></textarea>

        <button class="btn btn-primary w-100 mt-3">
            Generate Signature
        </button>
    </form>

</div>
{% endblock %}
