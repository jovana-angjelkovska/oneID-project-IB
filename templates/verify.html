{% extends "base.html" %}

{% block title %}Verify Signature{% endblock %}

{% block content %}
<div class="app-card text-center">

    <h2>Verify Signature</h2>

    <p class="text-muted">
        Logged in as: <b>{{ session["username"] }}</b>
    </p>

    <form method="POST">

        <textarea name="document" class="form-control mt-3"
                  placeholder="Original document" required></textarea>

        <textarea name="signature" class="form-control mt-3"
                  placeholder="Paste digital signature here" required></textarea>

        <button class="btn btn-success w-100 mt-3">
            Verify Signature
        </button>

    </form>

</div>
{% endblock %}
